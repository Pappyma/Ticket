<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-20">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketZero | AI Customer Assistance Agency</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"] },
            colors: {
              brand: {
                dark: "#0B0F19",
                card: "#111827",
                primary: "#3B82F6",
                accent: "#8B5CF6",
                success: "#10B981",
              },
            },
          },
        },
      };
    </script>

    <style>
      html, body { background-color: #0b0f19; color: #e2e8f0; min-height: 100vh; overflow-x: hidden; }
      
      /* Final Branded Chat Styles */
      df-messenger {
        z-index: 2147483647 !important;
        position: fixed !important;
        bottom: 24px !important;
        right: 24px !important;
        --df-messenger-chat-window-height: 550px;
        --df-messenger-chat-window-width: 360px;
        --df-messenger-primary-color: #3b82f6;
        --df-messenger-chat-background: #0b1220;
        --df-messenger-font-color: #e5e7eb;
        --df-messenger-titlebar-background: #3b82f6;
        --df-messenger-message-user-background: #3b82f6;
        --df-messenger-message-bot-background: #111827;

        /* TYPING AREA FIX: Forces Dark Background with White Text */
        --df-messenger-input-background: #111827 !important;
        --df-messenger-input-font-color: #ffffff !important; 
        --df-messenger-input-placeholder-font-color: #94a3b8 !important;
      }

      #tz-teaser {
        position: fixed; right: 92px; bottom: 92px; max-width: 300px;
        padding: 12px; border-radius: 14px; background: #ffffff; color: #111827;
        font-size: 13px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        cursor: pointer; z-index: 2147483647; display: none; opacity: 0;
        transition: all 0.3s ease;
      }
      #tz-teaser.show { display: block; opacity: 1; transform: translateY(0); }
    </style>

    <script type="importmap">
      { "imports": { "react": "https://aistudiocdn.com/react@^19.2.0", "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/", "react/": "https://aistudiocdn.com/react@^19.2.0/" } }
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>

    <div id="tz-teaser" onclick="document.querySelector('df-messenger-chat-bubble').openChat()">
      Curious how we resolve 85% of tickets instantly? Ask me anything!
    </div>

    <script>
      window.addEventListener("load", () => {
        const teaser = document.getElementById("tz-teaser");
        setTimeout(() => teaser.classList.add("show"), 10000); 
      });
    </script>

    <df-messenger
      location="us-central1"
      project-id="grounded-jetty-460322-u8"
      agent-id="4fbb0e12-3c78-4da4-833c-4eabff6af97e"
      language-code="en"
    >
      <df-messenger-chat-bubble chat-title="TicketZero Assistant"></df-messenger-chat-bubble>
    </df-messenger>
  </body>
</html>
